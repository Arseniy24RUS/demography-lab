name: Publish workshop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demography-compiled-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node --test tests/deployment/pages-source.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:survey-bundle
      - name: Verify public corpus and configuration
        run: |
          node scripts/seed-supabase.mjs --check
          node scripts/seed-roadmaps.mjs --check
          node scripts/check-pages.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Pages workflow source
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_REPOSITORY is supplied by GitHub Actions.
        run: node scripts/assert-pages-source.mjs
      - name: Publish compiled application
        id: deployment
        uses: actions/deploy-pages@v4
