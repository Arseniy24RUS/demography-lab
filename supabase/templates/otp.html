<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Код входа в Демографическую мастерскую</title></head>
<body style="margin:0;padding:32px;font:17px/1.6 Arial,sans-serif;color:#183e3a;background:#f4f7f4">
  <main style="max-width:520px;margin:auto;padding:32px;background:white;border-radius:16px">
    <h1 style="font-size:24px;font-weight:600">Демографическая мастерская</h1>
    <p>Введите этот одноразовый код на экране входа:</p>
    <p style="font-size:36px;letter-spacing:7px;font-weight:600;color:#176b60">{{ .Token }}</p>
    <p>Код действует 10 минут. Он подтверждает доступ к вашему адресу электронной почты. Пароль создавать не нужно.</p>
    <p style="font-size:14px;color:#64736e">Если вы не запрашивали вход, просто оставьте это письмо без ответа.</p>
  </main>
</body>
</html>
